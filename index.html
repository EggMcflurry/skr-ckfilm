<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FearBase</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c090d; --card-bg: #161218; --accent-blood: #8b0000;
            --glow-orange: #ff6b00; --text-main: #e2e8f0; --text-muted: #94a3b8; --border-color: #2d2430;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 500px; margin: 0 auto; background: var(--card-bg); border: 2px solid var(--border-color); padding: 2rem; border-radius: 12px; }
        h1 { font-family: 'Creepster', cursive; color: var(--accent-blood); text-align: center; margin-bottom: 1.5rem; font-size: 2.5rem; letter-spacing: 2px; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        input, select { background: #0a070b; border: 1px solid var(--border-color); padding: 0.85rem; color: var(--text-main); border-radius: 6px; width: 100%; }
        input[type="file"] { padding: 0.5rem; cursor: pointer; }
        button { background: var(--accent-blood); color: white; border: none; padding: 0.9rem; width: 100%; border-radius: 6px; font-family: 'Special Elite', cursive; cursor: pointer; margin-top: 0.5rem; }
        button:hover { opacity: 0.9; }
        
        #appView { display: none; max-width: 1000px; margin: 0 auto; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
        
        /* Flikar */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .tab-btn { background: #161218; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.75rem 1.5rem; border-radius: 6px; font-family: 'Special Elite', cursive; cursor: pointer; font-size: 1rem; }
        .tab-btn.active { background: var(--accent-blood); color: white; border-color: var(--accent-blood); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .movie-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .movie-card.watched { border-color: #2e5c31; }
        .movie-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border-color); background: #000; }
        .movie-content { padding: 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex-grow: 1; }
        .movie-title { font-family: 'Special Elite', cursive; font-size: 1.15rem; color: var(--text-main); }
        
        .actions-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .toggle-btn { background: #222; color: #fff; border: 1px solid var(--border-color); padding: 0.4rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; flex: 1; font-family: 'Inter', sans-serif; }
        .toggle-btn:hover { background: #333; }
        .delete-btn { background: #331111; color: #ff6b6b; border: 1px solid #8b0000; padding: 0.4rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; font-family: 'Inter', sans-serif; }
        .delete-btn:hover { background: #551111; }
        
        .rating-select { background: #0a070b; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.3rem; border-radius: 4px; font-size: 0.85rem; margin-top: 0.4rem; width: 100%; }
    </style>
</head>
<body>

    <!-- Inloggningsvy -->
    <div id="authContainer" class="container">
        <h1>FearBase</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Ange ditt namn och gängets Vault-kod</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Ditt namn</label>
                <input type="text" id="nameInput" required placeholder="t.ex. Anna">
            </div>
            <div class="form-group">
                <label>Gemensam Vault-kod</label>
                <input type="password" id="secretCodeInput" required placeholder="Hemlig gängkod">
            </div>
            <button type="submit">Logga in</button>
        </form>
    </div>

    <!-- Huvudapplikation -->
    <div id="appView">
        <div class="user-bar">
            <div>
                <h2 style="font-family: 'Creepster', cursive; color: var(--accent-blood); font-size: 1.8rem; letter-spacing: 1px;">FearBase</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted);" id="userDisplay"></p>
            </div>
            <button id="logoutBtn" style="background: #333; width: auto; padding: 0.5rem 1rem; margin: 0;">Logga ut</button>
        </div>

        <!-- Flikknappar -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('unwatchedTab', this)"><i class="fa-solid fa-film"></i> Att titta på</button>
            <button class="tab-btn" onclick="switchTab('watchedTab', this)"><i class="fa-solid fa-circle-check"></i> Redan sedda & Betyg</button>
        </div>

        <!-- FLIK 1: Att titta på -->
        <div id="unwatchedTab" class="tab-content active">
            <div class="container" style="max-width: 100%; margin-bottom: 2rem;">
                <h3 style="font-family: 'Special Elite', cursive; color: var(--glow-orange); margin-bottom: 1rem;"><i class="fa-solid fa-skull"></i> Lägg till skräckis med bild</h3>
                <form id="movieForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Filmtitel</label>
                            <input type="text" id="title" required placeholder="t.ex. The Conjuring">
                        </div>
                        <div class="form-group">
                            <label>Genre</label>
                            <select id="genre">
                                <option value="Slasher">Slasher</option>
                                <option value="Övernaturligt">Övernaturligt / Spöken</option>
                                <option value="Zombie">Zombie / Apokalyps</option>
                                <option value="Psykologisk">Psykologisk skräck</option>
                                <option value="Monster / Creature">Monster / Creature Feature</option>
                                <option value="Found Footage">Found Footage</option>
                                <option value="Body Horror">Body Horror</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Bild / Screenshot</label>
                        <input type="file" id="imageFile" accept="image/*" required>
                    </div>
                    <button type="submit" id="submitBtn">Ladda upp film</button>
                </form>
            </div>

            <h3 style="font-family: 'Special Elite', cursive; color: var(--text-main); margin-bottom: 1rem;">Filmkö</h3>
            <div id="unwatchedGrid" class="movie-grid"></div>
        </div>

        <!-- FLIK 2: Redan sedda & Betyg -->
        <div id="watchedTab" class="tab-content">
            <h3 style="font-family: 'Special Elite', cursive; color: var(--text-main); margin-bottom: 1rem;">Sedda filmer & Betygssättning</h3>
            <div id="watchedGrid" class="movie-grid"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://unjpynoinicuzfbgbyez.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Jd88Etk-decOvPp-onu65g_tXvk-rTW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const VAULT_SECRET_CODE = "skräck88";

        const authContainer = document.getElementById('authContainer');
        const appView = document.getElementById('appView');
        const loginForm = document.getElementById('loginForm');
        const nameInput = document.getElementById('nameInput');
        const secretCodeInput = document.getElementById('secretCodeInput');
        const userDisplay = document.getElementById('userDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const movieForm = document.getElementById('movieForm');
        const unwatchedGrid = document.getElementById('unwatchedGrid');
        const watchedGrid = document.getElementById('watchedGrid');
        const submitBtn = document.getElementById('submitBtn');

        let currentUserName = localStorage.getItem('vault_name');

        if (currentUserName) {
            showApp(currentUserName);
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const enteredCode = secretCodeInput.value.trim();
            const name = nameInput.value.trim();

            if (enteredCode !== VAULT_SECRET_CODE) {
                alert('Felaktig Vault-kod! Fråga i gänget efter rätt kod.');
                return;
            }

            if (!name) {
                alert('Du måste skriva ett namn!');
                return;
            }

            localStorage.setItem('vault_name', name);
            currentUserName = name;
            showApp(name);
        });

        function showApp(name) {
            authContainer.style.display = 'none';
            appView.style.display = 'block';
            userDisplay.innerText = `Inloggad som: ${name}`;
            fetchMovies();
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('vault_name');
            authContainer.style.display = 'block';
            appView.style.display = 'none';
            nameInput.value = '';
            secretCodeInput.value = '';
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function fetchMovies() {
            const { data, error } = await supabaseClient.from('movies').select('*').order('id', { ascending: false });
            if (error) { console.error(error); return; }

            unwatchedGrid.innerHTML = '';
            watchedGrid.innerHTML = '';

            let unwatchedCount = 0;
            let watchedCount = 0;

            if (!data || data.length === 0) {
                unwatchedGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Inga filmer tillagda än.</p>';
                watchedGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Inga sedda filmer än.</p>';
                return;
            }

            data.forEach(movie => {
                const card = document.createElement('div');
                card.className = `movie-card ${movie.watched ? 'watched' : ''}`;
                
                const imgTag = movie.image_url 
                    ? `<img src="${movie.image_url}" class="movie-img" alt="Filmomslag">`
                    : `<div class="movie-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);">Ingen bild</div>`;

                const canDelete = movie.director === currentUserName;
                const deleteButtonHtml = canDelete 
                    ? `<button class="delete-btn" onclick="deleteMovie(${movie.id})" title="Ta bort"><i class="fa-solid fa-trash"></i></button>` 
                    : '';

                if (!movie.watched) {
                    // Kort för "Att titta på"-fliken
                    card.innerHTML = `
                        ${imgTag}
                        <div class="movie-content">
                            <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                            <p style="font-size: 0.85rem; color: var(--glow-orange);">Genre: ${escapeHtml(movie.genre)}</p>
                            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: auto;">Tillagd av: ${escapeHtml(movie.director || 'Okänd')}</p>
                            <div class="actions-row">
                                <button class="toggle-btn" onclick="toggleWatched(${movie.id}, true)">Märk som sedd ✓</button>
                                ${deleteButtonHtml}
                            </div>
                        </div>
                    `;
                    unwatchedGrid.appendChild(card);
                    unwatchedCount++;
                } else {
                    // Kort för "Redan sedda & Betyg"-fliken med betygsväljare
                    const currentRating = movie.rating || 3;
                    card.innerHTML = `
                        ${imgTag}
                        <div class="movie-content">
                            <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                            <p style="font-size: 0.85rem; color: var(--glow-orange);">Genre: ${escapeHtml(movie.genre)}</p>
                            
                            <div style="margin-top: 0.3rem;">
                                <label style="font-size:0.7rem; color:var(--text-muted);">Betyg (Skallar):</label>
                                <select class="rating-select" onchange="updateRating(${movie.id}, this.value)">
                                    <option value="5" ${currentRating == 5 ? 'selected' : ''}>💀💀💀💀💀 (Mästerverk)</option>
                                    <option value="4" ${currentRating == 4 ? 'selected' : ''}>💀💀💀💀 (Riktigt bra)</option>
                                    <option value="3" ${currentRating == 3 ? 'selected' : ''}>💀💀💀 (Helt okej)</option>
                                    <option value="2" ${currentRating == 2 ? 'selected' : ''}>💀💀 (Mja, sådär)</option>
                                    <option value="1" ${currentRating == 1 ? 'selected' : ''}>💀 (Kalkonfilm)</option>
                                </select>
                            </div>

                            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: auto;">Tillagd av: ${escapeHtml(movie.director || 'Okänd')}</p>
                            <div class="actions-row">
                                <button class="toggle-btn" onclick="toggleWatched(${movie.id}, false)">Ångra (Till osett)</button>
                                ${deleteButtonHtml}
                            </div>
                        </div>
                    `;
                    watchedGrid.appendChild(card);
                    watchedCount++;
                }
            });

            if (unwatchedCount === 0) {
                unwatchedGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Inga filmer i kön just nu.</p>';
            }
            if (watchedCount === 0) {
                watchedGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Inga filmer märkta som sedda än. Klicka på "Märk som sedd" på en film i kön för att flytta hit den!</p>';
            }
        }

        async function toggleWatched(id, newStatus) {
            const { error } = await supabaseClient.from('movies').update({ watched: newStatus }).eq('id', id);
            if (error) {
                alert('Kunde inte uppdatera status: ' + error.message);
                return;
            }
            fetchMovies();
        }

        async function updateRating(id, newRating) {
            const { error } = await supabaseClient.from('movies').update({ rating: parseInt(newRating) }).eq('id', id);
            if (error) {
                alert('Kunde inte spara betyg: ' + error.message);
            }
        }

        async function deleteMovie(id) {
            if (!confirm('Är du säker på att du vill ta bort denna film?')) return;

            const { error } = await supabaseClient.from('movies').delete().eq('id', id);
            if (error) {
                alert('Kunde inte ta bort filmen: ' + error.message);
                return;
            }
            fetchMovies();
        }

        movieForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sparar film...';

            const title = document.getElementById('title').value;
            const genre = document.getElementById('genre').value;
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];

            if (!file) {
                alert('Välj en bild!');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Ladda upp film';
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Image = reader.result;

                const newMovie = {
                    title: title,
                    director: currentUserName, 
                    genre: genre,
                    rating: 3,
                    watched: false,
                    image_url: base64Image
                };

                const { error } = await supabaseClient.from('movies').insert([newMovie]);
                if (error) {
                    alert('Kunde inte spara filmen: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Ladda upp film';
                    return;
                }

                movieForm.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = 'Ladda upp film';
                fetchMovies();
            };

            reader.onerror = function (error) {
                alert('Kunde inte läsa bilden: ' + error);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Ladda upp film';
            };
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
